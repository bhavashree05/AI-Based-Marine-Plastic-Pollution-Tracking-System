version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marineguard-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///backend/marineguard.db
      - YOLO_MODEL_NAME=yolov8n.pt
      - ALLOWED_ORIGINS=*
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/backups:/app/backend/backups
    restart: unless-stopped
